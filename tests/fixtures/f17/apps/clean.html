<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Issue board</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2.1.1/out/water.css">
<style>
  .row { display: flex; gap: 8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<h1>Issues</h1>
<form id="f"><input id="q" placeholder="filter"><button type="submit">Go</button></form>
<ul id="list"></ul>
<p id="empty" hidden>No issues.</p>
<a href="#" id="open">Open tracker</a>
<script>
(async () => {
  await archestra.ready;
  const saved = await archestra.storage.user.get("filter");
  document.getElementById("q").value = saved ?? "";
  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const q = document.getElementById("q").value;
    await archestra.storage.user.set("filter", { q });
    const tools = await archestra.tools.list();
    const name = tools.find((t) => t.name.endsWith("__list_issues")).name;
    const res = await archestra.tools.call(name, { q });
    document.getElementById("list").textContent = JSON.stringify(res);
    await archestra.ui.updateModelContext("Filtered issues by " + q);
  });
  document.getElementById("open").addEventListener("click", (e) => {
    e.preventDefault();
    archestra.ui.openLink("https://example.com/tracker");
  });
})();
</script>
</body>
</html>
